r ${token}` };\n\nasync function call(path, method='GET', payload) {\n  const r = await fetch(BASE + path, { method, headers: H, body: payload ? JSON.stringify(payload) : undefined });\n  const b = await r.json();\n  if (b.code !== 0) throw new Error(`${path} failed: ${JSON.stringify(b)}`);\n  return b.data;\n}\n\n// 1. sync\nconst syncData = await call('/api/v1/plugin/sync', 'POST', {clientVersion:'0.1.0', deviceId:'dev-decode-check'});\nconsole.log('sync decode:', JSON.stringify(decodeSync(syncData)));\n\n// 2. reply-config\nconst replyData = await call('/api/v1/plugin/reply-config');\nconst rc = decodeReplyConfig(replyData);\nconsole.log('reply-config decode: version', rc.version, 'templates', Object.keys(rc.templates).length, 'rules', rc.keywordRules.length);\n\n// 3. ai-reply\nconst aiData = await call('/api/v1/plugin/ai-reply', 'POST', {messageId:'m1',chatId:'c1',buyerUserId:'u1',itemId:'i1',content:'hi'});\nconsole.log('ai-reply decode:', JSON.stringify(decodeAiReply(aiData)));\n\n// 4. waiting-payment null\nconst wp = await call('/api/v1/plugin/orders/waiting-payment', 'POST', {chatId:'c1'});\nconsole.log('waiting-payment decode:', decodeWaitingPaymentOrder(wp));\n\n// 5. by-status null\nconst bs = await call('/api/v1/plugin/orders/by-status', 'POST', {chatId:'c1', status:25});\nconsole.log('by-status decode:', decodeOrderByStatus(bs));\n\n// 6. ticket-results []\nconst tr = await call('/api/v1/plugin/orders/ticket-results', 'POST', {});\nconsole.log('ticket-results decode:', JSON.stringify(decodeTicketResults(tr)));\n\n// 7. price-adjusted → null\nawait call('/api/v1/plugin/orders/price-adjusted', 'POST', {id:'does-not-exist'}).catch(e => console.log('price-adjusted missing → 预期错误'));\nconsole.log('✅ 全部插件严格解码通过');\nEOF\nnode /tmp/decode_check.mjs 2>&1", "Bash=cd /d/workspcae/extension && for i in 1 2 3 4 5 6 7 8; do curl -s http://127.0.0.1:8000/health >/dev/null 2>&1 && break; sleep 1; done; echo \"=== health ===\" && curl -s http://127.0.0.1:8000/health &