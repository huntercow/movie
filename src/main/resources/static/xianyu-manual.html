<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>闲鱼异常订单处理台</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --line: #d8dde6;
            --text: #1f2937;
            --muted: #64748b;
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #15803d;
            --warn: #b45309;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .shell {
            width: min(1280px, calc(100% - 32px));
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 64px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0;
        }

        main {
            padding: 18px 0 28px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(150px, 180px) minmax(160px, 220px) minmax(220px, 1fr) auto auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 14px;
        }

        label {
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            padding: 7px 9px;
            font: inherit;
        }

        textarea {
            min-height: 62px;
            resize: vertical;
        }

        button {
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            padding: 7px 11px;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
            white-space: nowrap;
        }

        button.primary {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        button.danger {
            border-color: #fecaca;
            color: var(--danger);
        }

        button.success {
            border-color: #bbf7d0;
            color: var(--success);
        }

        button.warn {
            border-color: #fed7aa;
            color: var(--warn);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .6;
        }

        .summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0;
            color: var(--muted);
            min-height: 24px;
        }

        .status {
            color: var(--muted);
        }

        .status.error {
            color: var(--danger);
        }

        .status.ok {
            color: var(--success);
        }

        .table-wrap {
            overflow: auto;
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 8px;
        }

        table {
            width: 100%;
            min-width: 1080px;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid var(--line);
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #f8fafc;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr.selected {
            background: #eff6ff;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }

        .muted {
            color: var(--muted);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge.NEED_MANUAL {
            border-color: #fecaca;
            color: var(--danger);
            background: #fff7f7;
        }

        .badge.ISSUED_WAIT_DELIVER {
            border-color: #bbf7d0;
            color: var(--success);
            background: #f0fdf4;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-width: 220px;
        }

        .note-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 8px;
        }

        .panels {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 14px;
            margin-top: 14px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            min-height: 180px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid var(--line);
            padding: 10px 12px;
            font-weight: 700;
        }

        .panel-body {
            padding: 12px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 8px 10px;
        }

        .detail-grid dt {
            color: var(--muted);
            font-weight: 700;
        }

        .detail-grid dd {
            margin: 0;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .event-list {
            display: grid;
            gap: 8px;
            max-height: 360px;
            overflow: auto;
        }

        .event-item {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px;
            background: #fbfdff;
        }

        .event-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        pre {
            margin: 6px 0 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        @media (max-width: 900px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px 0;
            }

            .panels {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="shell topbar">
        <h1>闲鱼异常订单处理台</h1>
        <div class="status" id="status">等待加载</div>
    </div>
</header>

<main class="shell">
    <section class="toolbar" aria-label="订单筛选">
        <label>
            状态
            <select id="statusFilter">
                <option value="NEED_MANUAL">NEED_MANUAL</option>
                <option value="ISSUED_WAIT_DELIVER">ISSUED_WAIT_DELIVER</option>
                <option value="PAID_WAIT_SUBMIT">PAID_WAIT_SUBMIT</option>
                <option value="TICKETING">TICKETING</option>
                <option value="DELIVERED">DELIVERED</option>
                <option value="REFUNDED">REFUNDED</option>
                <option value="CLOSED">CLOSED</option>
                <option value="">全部</option>
            </select>
        </label>
        <label>
            会话 chatId
            <input id="chatIdFilter" placeholder="可留空">
        </label>
        <label>
            X-Plugin-Token
            <input id="pluginToken" type="password" autocomplete="off" placeholder="后端未配置 token 可留空">
        </label>
        <button class="primary" id="refreshBtn">刷新</button>
        <button id="pendingBtn">待发货</button>
    </section>

    <div class="summary">
        <span id="countText">0 条订单</span>
        <span class="muted">人工退款或关闭后，该买家会话会释放，可继续下一单。</span>
    </div>

    <section class="table-wrap" aria-label="订单列表">
        <table>
            <thead>
            <tr>
                <th>闲鱼订单</th>
                <th>会话 / 买家</th>
                <th>报价 / 支付</th>
                <th>状态</th>
                <th>错误 / 取票</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="ordersBody">
            <tr>
                <td colspan="6" class="muted">暂无数据</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="panels" aria-label="订单详情和事件">
        <article class="panel">
            <div class="panel-header">
                <span>订单详情</span>
                <button id="clearDetailBtn" type="button">清空</button>
            </div>
            <div class="panel-body" id="detailPanel">
                <div class="muted">点击订单查看详情。</div>
            </div>
        </article>
        <article class="panel">
            <div class="panel-header">
                <span>最近事件</span>
                <button id="loadAllEventsBtn" type="button">全部事件</button>
            </div>
            <div class="panel-body">
                <div class="event-list" id="eventsPanel">
                    <div class="muted">点击订单查看该会话事件。</div>
                </div>
            </div>
        </article>
    </section>
</main>

<script>
    const els = {
        status: document.querySelector("#status"),
        statusFilter: document.querySelector("#statusFilter"),
        chatIdFilter: document.querySelector("#chatIdFilter"),
        pluginToken: document.querySelector("#pluginToken"),
        refreshBtn: document.querySelector("#refreshBtn"),
        pendingBtn: document.querySelector("#pendingBtn"),
        clearDetailBtn: document.querySelector("#clearDetailBtn"),
        loadAllEventsBtn: document.querySelector("#loadAllEventsBtn"),
        countText: document.querySelector("#countText"),
        ordersBody: document.querySelector("#ordersBody"),
        detailPanel: document.querySelector("#detailPanel"),
        eventsPanel: document.querySelector("#eventsPanel")
    };
    let selectedPlatformOrderId = "";

    const savedToken = localStorage.getItem("xianyuManualPluginToken") || "";
    els.pluginToken.value = savedToken;

    els.pluginToken.addEventListener("change", () => {
        localStorage.setItem("xianyuManualPluginToken", els.pluginToken.value.trim());
    });
    els.refreshBtn.addEventListener("click", () => loadOrders());
    els.pendingBtn.addEventListener("click", () => loadPendingDeliveries());
    els.statusFilter.addEventListener("change", () => loadOrders());
    els.clearDetailBtn.addEventListener("click", () => {
        selectedPlatformOrderId = "";
        els.detailPanel.innerHTML = '<div class="muted">点击订单查看详情。</div>';
        els.eventsPanel.innerHTML = '<div class="muted">点击订单查看该会话事件。</div>';
        renderSelection();
    });
    els.loadAllEventsBtn.addEventListener("click", () => loadEvents(""));

    function setStatus(message, kind = "") {
        els.status.textContent = message;
        els.status.className = "status " + kind;
    }

    function headers() {
        const result = {"Content-Type": "application/json"};
        const token = els.pluginToken.value.trim();
        if (token) {
            result["X-Plugin-Token"] = token;
        }
        return result;
    }

    async function api(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                ...headers(),
                ...(options.headers || {})
            }
        });
        const body = await response.json().catch(() => null);
        if (!response.ok || !body || body.success === false) {
            throw new Error((body && body.message) || ("HTTP " + response.status));
        }
        return body.data;
    }

    async function loadOrders() {
        setBusy(true);
        try {
            const params = new URLSearchParams();
            if (els.statusFilter.value) {
                params.set("status", els.statusFilter.value);
            }
            if (els.chatIdFilter.value.trim()) {
                params.set("chatId", els.chatIdFilter.value.trim());
            }
            const data = await api("/api/xianyu/orders" + (params.toString() ? "?" + params : ""));
            renderOrders(data || []);
            setStatus("已加载", "ok");
        } catch (error) {
            renderOrders([]);
            setStatus(error.message, "error");
        } finally {
            setBusy(false);
        }
    }

    async function loadPendingDeliveries() {
        setBusy(true);
        try {
            const data = await api("/api/xianyu/deliveries/pending");
            renderOrders(data || []);
            setStatus("已加载待发货", "ok");
        } catch (error) {
            renderOrders([]);
            setStatus(error.message, "error");
        } finally {
            setBusy(false);
        }
    }

    async function loadEvents(chatId) {
        try {
            const params = new URLSearchParams();
            if (chatId) {
                params.set("chatId", chatId);
            }
            const events = await api("/api/xianyu/events" + (params.toString() ? "?" + params : ""));
            renderEvents(events || []);
        } catch (error) {
            els.eventsPanel.innerHTML = `<div class="status error">${escapeHtml(error.message)}</div>`;
        }
    }

    async function updateManual(platformOrderId, status, noteElement) {
        const note = noteElement.value.trim() || defaultNote(status);
        if (!confirm("确认将订单 " + platformOrderId + " 标记为 " + status + "？")) {
            return;
        }
        setBusy(true);
        try {
            await api("/api/xianyu/orders/" + encodeURIComponent(platformOrderId) + "/manual", {
                method: "POST",
                body: JSON.stringify({
                    status,
                    note
                })
            });
            setStatus("已更新 " + platformOrderId, "ok");
            await loadOrders();
        } catch (error) {
            setStatus(error.message, "error");
        } finally {
            setBusy(false);
        }
    }

    function renderOrders(orders) {
        els.countText.textContent = orders.length + " 条订单";
        if (!orders.length) {
            els.ordersBody.innerHTML = '<tr><td colspan="6" class="muted">暂无数据</td></tr>';
            return;
        }
        els.ordersBody.replaceChildren(...orders.map(order => {
            const tr = document.createElement("tr");
            tr.dataset.platformOrderId = order.platformOrderId || "";
            tr.addEventListener("click", (event) => {
                if (event.target.closest("button, textarea")) {
                    return;
                }
                showOrderDetail(order);
            });
            const note = document.createElement("textarea");
            note.placeholder = "处理备注";
            note.value = order.lastError || "";

            tr.append(
                td(orderCell(order)),
                td(chatCell(order)),
                td(priceCell(order)),
                td(statusCell(order)),
                td(errorCell(order)),
                td(actionCell(order, note))
            );
            return tr;
        }));
        renderSelection();
    }

    function orderCell(order) {
        const box = document.createElement("div");
        box.innerHTML = `
            <div class="mono">${escapeHtml(order.platformOrderId || "")}</div>
            <div class="muted mono">${escapeHtml(order.tradeNo || "")}</div>
            <div class="muted">本地单：${escapeHtml(order.localOrderNo || "-")}</div>
            <div class="muted">商品：${escapeHtml(order.itemId || "-")}</div>
        `;
        return box;
    }

    function chatCell(order) {
        const box = document.createElement("div");
        box.innerHTML = `
            <div class="mono">${escapeHtml(order.chatId || "")}</div>
            <div class="muted mono">${escapeHtml(order.buyerUserId || "-")}</div>
        `;
        return box;
    }

    function priceCell(order) {
        const box = document.createElement("div");
        box.innerHTML = `
            <div>支付：${money(order.paidAmount)}</div>
            <div>报价：${money(order.quotedAmount)}</div>
            <div class="muted mono">${escapeHtml(order.quoteNo || "-")}</div>
        `;
        return box;
    }

    function statusCell(order) {
        const box = document.createElement("div");
        box.innerHTML = `
            <span class="badge ${escapeHtml(order.status || "")}">${escapeHtml(order.status || "")}</span>
            <div class="muted">轮询：${order.shouldPoll ? "是" : "否"}</div>
            <div class="muted">发货：${order.shouldDeliver ? "是" : "否"}</div>
        `;
        return box;
    }

    function errorCell(order) {
        const box = document.createElement("div");
        const ticket = order.ticketCodeInfo || "";
        box.innerHTML = `
            <div>${escapeHtml(order.lastError || "-")}</div>
            <div class="muted">${escapeHtml(ticket.slice(0, 160))}</div>
        `;
        return box;
    }

    function actionCell(order, note) {
        const box = document.createElement("div");
        const buttons = document.createElement("div");
        buttons.className = "actions";
        buttons.append(
            actionButton("详情", "", () => showOrderDetail(order)),
            actionButton("已退款", "danger", () => updateManual(order.platformOrderId, "REFUNDED", note)),
            actionButton("已关闭", "warn", () => updateManual(order.platformOrderId, "CLOSED", note)),
            actionButton("已发货", "success", () => updateManual(order.platformOrderId, "DELIVERED", note))
        );
        const noteRow = document.createElement("div");
        noteRow.className = "note-row";
        noteRow.append(note);
        box.append(buttons, noteRow);
        return box;
    }

    function showOrderDetail(order) {
        selectedPlatformOrderId = order.platformOrderId || "";
        renderSelection();
        const local = order.order || {};
        els.detailPanel.innerHTML = "";
        const detail = document.createElement("dl");
        detail.className = "detail-grid";
        [
            ["闲鱼订单", order.platformOrderId],
            ["交易号", order.tradeNo],
            ["会话", order.chatId],
            ["买家", order.buyerUserId],
            ["商品", order.itemId],
            ["报价单", order.quoteNo],
            ["本地单", order.localOrderNo],
            ["支付金额", money(order.paidAmount)],
            ["报价金额", money(order.quotedAmount)],
            ["状态", order.status],
            ["最后错误", order.lastError],
            ["上游单号", local.upstreamOrderNo],
            ["上游状态", local.upstreamOrderStatus],
            ["取票信息", order.ticketCodeInfo || local.ticketCodeInfo],
            ["本地订单错误", local.lastSubmitError || local.lastSyncError]
        ].forEach(([label, value]) => {
            const dt = document.createElement("dt");
            dt.textContent = label;
            const dd = document.createElement("dd");
            dd.textContent = value == null || value === "" ? "-" : String(value);
            detail.append(dt, dd);
        });
        els.detailPanel.append(detail);
        if (order.chatId) {
            loadEvents(order.chatId);
        }
    }

    function renderEvents(events) {
        if (!events.length) {
            els.eventsPanel.innerHTML = '<div class="muted">暂无事件</div>';
            return;
        }
        els.eventsPanel.replaceChildren(...events.map(event => {
            const item = document.createElement("div");
            item.className = "event-item";
            item.innerHTML = `
                <div class="event-meta">
                    <span>${escapeHtml(event.messageType || "-")}</span>
                    <span>${escapeHtml(formatTime(event.createdAt))}</span>
                </div>
                <div class="mono">${escapeHtml(event.chatId || "-")} / ${escapeHtml(event.messageId || "-")}</div>
                <pre>${escapeHtml(formatRawPayload(event.rawPayload))}</pre>
            `;
            return item;
        }));
    }

    function renderSelection() {
        els.ordersBody.querySelectorAll("tr").forEach(row => {
            row.classList.toggle("selected", Boolean(selectedPlatformOrderId) && row.dataset.platformOrderId === selectedPlatformOrderId);
        });
    }

    function td(child) {
        const cell = document.createElement("td");
        cell.append(child);
        return cell;
    }

    function actionButton(text, className, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = text;
        button.addEventListener("click", onClick);
        return button;
    }

    function defaultNote(status) {
        if (status === "REFUNDED") {
            return "已人工退款";
        }
        if (status === "CLOSED") {
            return "已人工关闭";
        }
        if (status === "DELIVERED") {
            return "已人工确认发货";
        }
        return "已人工处理";
    }

    function money(value) {
        if (value === null || value === undefined || value === "") {
            return "-";
        }
        return Number(value).toFixed(2);
    }

    function formatTime(value) {
        if (!value) {
            return "-";
        }
        try {
            return new Date(value).toLocaleString();
        } catch {
            return String(value);
        }
    }

    function formatRawPayload(value) {
        if (!value) {
            return "-";
        }
        try {
            return JSON.stringify(JSON.parse(value), null, 2).slice(0, 1200);
        } catch {
            return String(value).slice(0, 1200);
        }
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
    }

    function setBusy(busy) {
        els.refreshBtn.disabled = busy;
        els.pendingBtn.disabled = busy;
    }

    loadOrders();
</script>
</body>
</html>
