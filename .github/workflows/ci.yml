name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-contract:
    name: backend-unit-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and contract tests
        run: mvn -B -ntp test
      - name: Scan generated test inputs and reports
        id: secret-scan
        if: always()
        run: bash .github/scripts/scan-secrets.sh
      - name: Upload backend unit reports
        if: ${{ always() && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-unit-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  backend-mysql-integration:
    name: backend-mysql-integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run MySQL and Flyway integration gate
        run: mvn -B -ntp verify -Pintegration
      - name: Scan generated integration reports
        id: secret-scan
        if: always()
        run: bash .github/scripts/scan-secrets.sh
      - name: Upload backend integration reports
        if: ${{ always() && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-integration-reports
          path: |
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  web-test-build:
    name: web-test-build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        working-directory: web
        run: npm ci
      - name: Run Web tests
        working-directory: web
        run: npm test
      - name: Run Web coverage
        working-directory: web
        run: npm run test:coverage
      - name: Typecheck and build Web console
        working-directory: web
        run: npm run build
      - name: Scan generated Web artifacts
        id: secret-scan
        if: always()
        run: bash .github/scripts/scan-secrets.sh
      - name: Upload Web reports
        if: ${{ always() && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-coverage
          path: |
            web/coverage/
            src/main/resources/static/console/
          if-no-files-found: ignore

  extension-test-build:
    name: extension-test-build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Run extension tests
        working-directory: extension
        run: npm test
      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck
      - name: Build extension
        working-directory: extension
        run: npm run build
      - name: Scan generated extension artifacts
        id: secret-scan
        if: always()
        run: bash .github/scripts/scan-secrets.sh
      - name: Upload extension build
        if: ${{ always() && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-dist
          path: extension/dist/
          if-no-files-found: ignore

  docs-and-diff-check:
    name: docs-and-diff-check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check documentation and diff
        run: bash .github/scripts/check-docs-and-diff.sh
