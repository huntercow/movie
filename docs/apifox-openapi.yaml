    XianyuQuoteResult:
      type: object
      properties:
        chatId: {type: string}
        messageId: {type: string}
        duplicated: {type: boolean}
        quoteNo: {type: string}
        quote:
          $ref: '#/components/schemas/QuoteResponse'
        replyMessage: {type: string}
    XianyuWaitingPaymentRequest:
      type: object
      required: [platformOrderId, chatId, buyerUserId, itemId, messageId]
      properties:
        platformOrderId: {type: string}
        chatId: {type: string}
        buyerUserId: {type: string}
        sellerUserId: {type: string}
        itemId: {type: string}
        messageId: {type: string}
    XianyuWaitingPaymentResponse:
      type: object
      required: [platformOrderId, quoteNo, totalPriceCents, status]
      properties:
        platformOrderId: {type: string}
        quoteNo: {type: string}
        totalPriceCents: {type: integer, format: int64}
        status:
          $ref: '#/components/schemas/XianyuFulfillmentStatus'
    XianyuAdjustedOrderRequest:
      type: object
      required: [adjustedAmountCents]
      properties:
        adjustedAmountCents:
          type: integer
          format: int64
          minimum: 1
    XianyuAmountVerificationSource:
      type: string
      enum: [XIANYU_ORDER_DETAIL_PRICE_INFO_AMOUNT]
    XianyuPaidVerificationRequest:
      type: object
      required: [paidAmountCents, itemTotalCents, postFeeCents, source]
      properties:
        paidAmountCents:
          type: integer
          format: int64
          minimum: 1
        itemTotalCents:
          type: integer
          format: int64
          minimum: 1
        postFeeCents:
          type: integer
          format: int64
          minimum: 0
        source:
          $ref: '#/components/schemas/XianyuAmountVerificationSource'
    XianyuVerificationFailureCode:
      type: string
      enum: [ADJUST_PRICE_REJECTED, ORDER_DETAIL_REQUEST_FAILED, ORDER_DETAIL_PROTOCOL_ERROR, ORDER_ID_MISMATCH, AMOUNT_MISMATCH, NON_ZERO_POST_FEE, MISSING_ADJUSTMENT]
    XianyuVerificationFailureRequest:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/XianyuVerificationFailureCode'
    XianyuManualOrderRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/XianyuFulfillmentStatus'
        note: {type: string}
    XianyuOrderResponse:
      type: object
      properties:
        platformOrderId: {type: string}
        tradeNo: {type: string}
        chatId: {type: string}
        buyerUserId: {type: string}
        itemId: {type: string}
        quoteNo: {type: string, nullable: true}
        localOrderNo: {type: string, nullable: true}
        paidAmount: {type: number, nullable: true}
        quotedAmount: {type: number, nullable: true}
        adjustedAmount: {type: number, nullable: true}
        amountVerificationSource:
          allOf:
            - $ref: '#/components/schemas/XianyuAmountVerificationSource'
          nullable: true
        adjustedAt: {type: string, format: date-time, nullable: true}
        amountVerifiedAt: {type: string, format: date-time, nullable: true}
        status:
          $ref: '#/components/schemas/XianyuFulfillmentStatus'
        lastError: {type: string, nullable: true}
        order:
          type: object
          allOf:
            - $ref: '#/components/schemas/OrderResponse'
          nullable: true
        shouldPoll: {type: boolean}
        shouldDeliver: {type: boolean}
        deliveryMessage: {type: string, nullable: true}
        ticketCodeInfo: {type: string, nullable: true}
        deliveryAttemptId: {type: string, nullable: true}
        deliveryAttemptStartedAt: {type: string, format: date-time, nullable: true}
        deliveryAttemptOutcome:
          type: string
          enum: [SUCCESS, FAILURE]
          nullable: true
        deliveryAttemptChannel: {type: string, nullable: true}
        deliveryAttemptErrorMessage: {type: string, nullable: true}
        deliveryOutcomeRecordedAt: {type: string, format: date-time, nullable: true}
    XianyuLatestQuoteResponse:
      type: object
      properties:
        chatId: {type: string}
        quoteNo: {type: string}
        quote:
          $ref: '#/components/schemas/QuoteResponse'
        replyMessage: {type: string}
    XianyuDeliveryResultRequest:
      type: object
      required: [attemptId, success, channel]
      properties:
        attemptId: {type: string}
        success: {type: boolean}
        channel: {type: string}
        errorMessage: {type: string}
    XianyuEventRequest:
      type: object
      required: [eventType]
      properties:
